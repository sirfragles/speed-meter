#
# Build every supported configuration of the Speed Meter firmware, replay the
# wheel detector against recorded rides, and publish the production images as a
# GitHub release when a v* tag is pushed.
#
# The builds run inside the same container image the project is developed with
# (ghcr.io/zephyrproject-rtos/zephyr-build), so CI and a local build use an
# identical toolchain - no SDK install step, no version drift.
#
# Every action is pinned to a commit SHA, the way Zephyr pins its own workflows:
# a tag is mutable, a SHA is not.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BOARD: holyiot_25008/nrf54l15/cpuapp
  APP_DIR: speed-meter/app

jobs:
  # ---------------------------------------------------------------------------
  # Host-side tests. The wheel detector is pure arithmetic with no Zephyr calls,
  # so the cheapest honest test is to replay motion recorded from a real board
  # through the production source file. Needs no cross toolchain, no hardware.
  # ---------------------------------------------------------------------------
  tests:
    name: host tests
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:main
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: speed-meter

      - name: Set up west workspace
        run: |
          set -eux
          # Same workaround as the build job: a container job gets GitHub's
          # HOME, which hides the CMake package registry the image uses to
          # advertise the Zephyr SDK.
          sdk_dir=$(ls -d /opt/toolchains/zephyr-sdk-* | sort -V | tail -n1)
          echo "ZEPHYR_SDK_INSTALL_DIR=$sdk_dir" >> "$GITHUB_ENV"

          west init -l speed-meter
          west update --narrow

      - name: Run host tests
        shell: bash
        run: |
          set -eux
          # The whole tree, not one suite: a new tests/<name>/ gets picked up
          # without another workflow edit.
          west twister -T speed-meter/tests \
            -p native_sim/native/64 -O twister-out --inline-logs -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-test-report
          path: |
            twister-out/twister.xml
            twister-out/**/handler.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # One job per configuration. fail-fast is off so a broken bench build still
  # shows whether production is fine.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:main
      # The image's default user cannot write into the mounted runner
      # workspace, and west needs to create .west/, zephyr/ and modules/ there.
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          # Simulation only - builds with no hardware attached.
          - name: base
            conf: ""
            sysbuild: false
          # Hall sensor / reed contact on the `wheel-sensor` GPIO.
          - name: gpio
            conf: "debug.conf;gpio.conf"
            sysbuild: false
          # Bench: MCUmgr/SMP + the `wheel` diagnostics shell.
          - name: bench
            conf: "debug.conf;diag.conf"
            sysbuild: false
          # Bench + the driver's own LIS2DH FIFO shell (needs the fork).
          - name: bench-fifo
            conf: "debug.conf;diag.conf;stream.conf"
            sysbuild: false
          # Production: magnetless accelerometer source, three-tier standstill
          # policy, MCUboot and on-demand DFU over BLE. Tier 3 stops the links
          # and the advertising and settles into System ON Idle, with the 1 Hz
          # wheel poll as its own wake source - nothing soldered, nothing
          # pressed. There is no System OFF variant: the board offers no wake
          # source on P0/P1 and cannot be modified to get one.
          - name: production
            conf: "debug.conf;diag.conf;power.conf;dfu.conf"
            sysbuild: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: speed-meter

      # west update pulls a full Zephyr tree plus its modules (over a gigabyte),
      # so keep it around between runs. Keyed on the manifest: bumping the
      # pinned Zephyr revision invalidates the cache.
      - name: Cache west workspace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .west
            zephyr
            modules
            tools
          key: west-${{ runner.os }}-${{ hashFiles('speed-meter/west.yml') }}

      - name: Initialise west workspace
        run: |
          set -eux
          # GitHub mounts its own HOME for container jobs, which hides the CMake
          # package registry the image uses to advertise the Zephyr SDK
          # (/home/user/.cmake/packages/Zephyr-sdk -> /opt/toolchains/...).
          # ZEPHYR_SDK_INSTALL_DIR is a no-op on a normal machine but is the
          # only thing that finds the SDK here. Discover the version rather
          # than pinning it, so an image bump does not break the build.
          sdk_dir=$(ls -d /opt/toolchains/zephyr-sdk-* | sort -V | tail -n1)
          echo "ZEPHYR_SDK_INSTALL_DIR=$sdk_dir" >> "$GITHUB_ENV"
          echo "Using Zephyr SDK at $sdk_dir"

          # `-l` reuses the checkout as the manifest repository instead of
          # cloning it again. Skipped when the cached workspace is restored.
          if [ ! -d .west ]; then
            west init -l speed-meter
          fi
          west update --narrow

      - name: Build
        # The zephyr-build image defaults to `sh` (dash), where the array
        # syntax below is a syntax error - ask for bash explicitly.
        shell: bash
        run: |
          # pipefail matters here: west's exit status has to survive the tee.
          set -euxo pipefail
          args=(west build -b "$BOARD" "$APP_DIR" -d build --pristine=always)
          if [ "${{ matrix.sysbuild }}" = "true" ]; then
            args+=(--sysbuild)
          fi
          if [ -n "${{ matrix.conf }}" ]; then
            args+=(-- "-DEXTRA_CONF_FILE=${{ matrix.conf }}")
          fi
          "${args[@]}" 2>&1 | tee build.log

      # Size report, posted to the run's summary page. size_report is what the
      # `footprint` CMake target runs; it is called directly because that works
      # for a plain build directory and for the application directory inside a
      # sysbuild one. A regression in size should be noticed, not discovered.
      - name: Footprint report
        shell: bash
        run: |
          set -eux
          build_dir=build
          if [ "${{ matrix.sysbuild }}" = "true" ]; then
            build_dir=build/app
          fi

          python3 zephyr/scripts/footprint/size_report \
            -k "$build_dir/zephyr/zephyr.elf" -z "$PWD/zephyr" -o "$build_dir" \
            --json "$build_dir/rom.json" rom
          python3 zephyr/scripts/footprint/size_report \
            -k "$build_dir/zephyr/zephyr.elf" -z "$PWD/zephyr" -o "$build_dir" \
            --json "$build_dir/ram.json" ram

          {
            echo '```'
            grep -A6 'Memory region' build.log | head -8 || true
            echo '```'
            echo
            python3 speed-meter/scripts/footprint_summary.py "$build_dir" \
              --title '${{ matrix.name }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        if: matrix.name == 'production'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: |
            build/merged_*.hex
            build/app/zephyr/zephyr.signed.bin
            build/app/zephyr/zephyr.signed.hex
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release. Only on a tag, and only once the tests passed and every
  # configuration built.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # gh is preinstalled on the runner, so fetching the artifact needs no
          # action at all - one less third-party dependency in the release path.
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n firmware -D firmware

      # Two images matter to a user, so give them names that say what they are:
      #   <tag>-full.hex   flash over SWD (bootloader + signed application)
      #   <tag>-dfu.bin    upload over BLE with an MCUmgr client
      - name: Prepare assets
        run: |
          set -eux
          cd firmware
          merged=$(ls merged_*.hex | head -n1)
          cp "$merged" "../${GITHUB_REF_NAME}-full.hex"
          cp app/zephyr/zephyr.signed.bin "../${GITHUB_REF_NAME}-dfu.bin"
          cp app/zephyr/zephyr.signed.hex "../${GITHUB_REF_NAME}-dfu.hex"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # -R is required: this job does not check the repository out, so gh
          # has no git remote to infer the target from
          # ("failed to run git: fatal: not a git repository").
          gh release create "$GITHUB_REF_NAME" \
            -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${GITHUB_REF_NAME}-full.hex" \
            "${GITHUB_REF_NAME}-dfu.bin" \
            "${GITHUB_REF_NAME}-dfu.hex"
