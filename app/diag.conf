#
# Extra configuration for the remote diagnostics build: accelerometer
# recording + calibration over MCUmgr/SMP (used by tools/wheel_cal.py).
#
# Usage:
#   west build -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;diag.conf"

# --- wheel diagnostics module ------------------------------------------------
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_CSC_DIAG=y
CONFIG_CSC_DIAG_REC_SAMPLES=4096

# --- shell over MCUmgr (no UART console needed) ------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048

CONFIG_MCUMGR=y
# MCUmgr dependencies (bez nich CONFIG_MCUMGR cicho spada do =n!).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# smpmgr on macOS cannot do Secure Connections pairing -> plain RW (bench only!)
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=3072
