# SPDX-License-Identifier: Apache-2.0
#
# On-demand firmware update (DFU) over BLE SMP via MCUboot.
#
# Usage (sysbuild builds MCUboot + app and merges them):
#   west build --sysbuild -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;diag.conf;power.conf;dfu.conf"
#
# The signed image to upload from nRF Connect Device Manager is:
#   build/speed_meter_diag_power_mcuboot/app/zephyr/zephyr.signed.bin

# Application-side DFU support (dfu_mode.c + dfu_button.c).
CONFIG_CSC_DFU=y

# MCUboot image management (upload + confirm + reset).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# MCUmgr image-management group (in addition to the OS/shell groups from
# diag.conf).
CONFIG_MCUMGR_GRP_IMG=y

# Enable MCUmgr notification hooks (img_mgmt callbacks drive the DFU LED
# states: upload in progress / image received).
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y

# Security: pairing/encryption for the SMP service.
CONFIG_BT_SMP=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Register the SMP service on demand only (hidden until DFU mode is entered).
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# Require an encrypted link (overrides the plain bench permission from
# diag.conf - the DFU build is production, the bench tool uses its own build).
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=n
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y

# Faster transfers.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
