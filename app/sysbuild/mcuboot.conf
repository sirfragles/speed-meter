# MCUboot image configuration (built by sysbuild).
#
# The bootloader must not use the UART: P1.04 (TX) / P1.05 (RX) is repurposed,
# P1.05 carries the LIS2DH12 INT1 wake line. Log over J-Link RTT instead, and
# keep serial recovery off (it would listen on P1.05 = INT1).
#
# NOTE: MCUboot uses LOG_MODE_MINIMAL, so its logs go through the console
# (RTT console here), not through the full LOG_BACKEND_RTT backend.

CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y

# No UART serial recovery in the bootloader.
CONFIG_MCUBOOT_SERIAL=n

# nRF54L15 specifics (mirrors MCUboot's boards/nrf54l15dk_nrf54l15_cpuapp.conf,
# which is not auto-applied to this custom board):
# do not feed a watchdog from the bootloader (no WDT on this board).
CONFIG_BOOT_WATCHDOG_FEED=n
