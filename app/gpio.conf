#
# Wheel revolutions from a GPIO pulse input (Hall sensor, reed contact or any
# switch to GND) instead of the accelerometer - see src/wheel_source_gpio.c.
# The pin comes from the `wheel-sensor` devicetree alias.
#
# Usage:
#   west build -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;gpio.conf"

CONFIG_CSC_SIMULATE=n
CONFIG_CSC_WHEEL_SENSOR_GPIO=y
