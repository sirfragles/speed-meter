# SPDX-License-Identifier: Apache-2.0
#
# Production power configuration. Wheel revolutions come from the accelerometer
# (magnetless) and the LIS2DH12 drops to a 1 Hz standby whenever the wheel
# stops.
#
# Usage:
#   west build --sysbuild -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;diag.conf;power.conf;dfu.conf"

# --- Wheel source: accelerometer, not the simulator ---------------------------
CONFIG_CSC_SIMULATE=n
CONFIG_CSC_WHEEL_SENSOR_ACCEL=y

# --- Standstill policy: three tiers, and no System OFF ------------------------
#
#   tier 2 (10 s)   the sensor alone drops to 1 Hz and the BLE link stays up -
#                   stopping at a traffic light must not cost the rider the
#                   watch connection.
#   tier 3 (300 s)  the ride is over: links dropped, advertising stopped, and
#                   the device settles into System ON Idle. The 1 Hz wheel poll
#                   is its own wake source, so the wheel still starts the
#                   device by itself with nothing pressed.
#
# There is no System OFF tier. That is not an oversight and not a TODO.
# Waking from System OFF is GPIO DETECT on P0/P1, or RESET - this part has no
# timer wake to fall back on - and the module wires the accelerometer's INT1
# and INT2 to P2.00 and P2.03, on a port that carries no gpiote-instance in the
# SoC devicetree (gpiote30 belongs to gpio0, gpiote20 to gpio1). An unmodified
# board therefore has no wake source at all, and arming one would power the
# device down and never bring it back. The board cannot usefully be modified.
#
# The cost is battery life, not function, and it is smaller than it sounds:
# advertising every 100 ms plus a maintained link runs to tens of microamps,
# while the core idling between two 1 Hz polls costs a few. Whether that gap is
# worth buying back is a measurement question, not an argument - section 8 of
# TEST-PLAN.md specifies it, and nothing has been measured yet.
CONFIG_CSC_POWER_SAVE=y
