# SPDX-License-Identifier: Apache-2.0
#
# Production / low-power variant: wheel revolutions come from the
# accelerometer (magnetless) and the LIS2DH12 drops to a 1 Hz standby with a
# movement interrupt armed whenever the wheel stops. When nobody is connected
# the SoC then enters System OFF and wakes on rotation (INT1 on P1.05).
#
# Usage:
#   west build --sysbuild -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;diag.conf;power.conf;dfu.conf"

# --- Wheel source: accelerometer, not the simulator ---------------------------
CONFIG_CSC_SIMULATE=n
CONFIG_CSC_WHEEL_SENSOR_ACCEL=y

# --- Sleep on standstill, wake on movement -----------------------------------
CONFIG_CSC_POWER_SAVE=y
CONFIG_CSC_POWER_SYSTEM_OFF=y
CONFIG_POWEROFF=y
