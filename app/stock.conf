#
# Production variant for an UNMODIFIED HOLYIOT-25008: nothing soldered, nothing
# rewired. Flash this if you have not touched the board.
#
# What works: the magnetless accelerometer source, the revolution detector, the
# CSCS service, and the full three-tier power state machine - tier 2 drops the
# sensor to 1 Hz while keeping the BLE link, tier 3 stops the links and the
# advertising altogether.
#
# What cannot work: System OFF, and the difference matters. Waking from System
# OFF on nRF54L15 is GPIO DETECT on P0/P1, or RESET - there is no timer wake to
# fall back on. The module wires INT1 to P2.00, and port 2 has neither GPIOTE
# nor SENSE, so a board that has not been modified has no way to wake the SoC.
# Arming a wake pin that is not connected would power the device down for good,
# so this variant does not arm one - and Kconfig refuses the option without
# CSC_POWER_WAKE_LINE_WIRED.
#
# Tier 3 therefore sleeps the radio instead of the chip: the links are dropped,
# the advertising stops, the sensor stays at 1 Hz, and the sampling thread - up
# and polling once a second - is what notices the wheel turning again and
# restarts advertising. The wheel still starts the device by itself.
#
# The cost is battery life, not function, and it is smaller than it sounds:
# advertising every 100 ms plus a maintained link runs to tens of microamps,
# while the core in System ON idle between two 1 Hz polls costs a few. For the
# last microamp you need the wire, and then you want power.conf instead.
#
# Usage:
#   west build --sysbuild -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;diag.conf;stock.conf;dfu.conf"

# --- Wheel source: accelerometer, not the simulator ---------------------------
CONFIG_CSC_SIMULATE=n
CONFIG_CSC_WHEEL_SENSOR_ACCEL=y

# --- Sleep on standstill, but never power the SoC down ------------------------
# Tier 2 only. CSC_POWER_SYSTEM_OFF is deliberately absent and
# CSC_POWER_WAKE_LINE_WIRED is deliberately not set - see the header.
CONFIG_CSC_POWER_SAVE=y
