# SPDX-License-Identifier: Apache-2.0
#
# Production variant for an UNMODIFIED HOLYIOT-25008: nothing soldered, nothing
# rewired. Flash this if you have not touched the board.
#
# What works: the magnetless accelerometer source, the revolution detector, the
# CSCS service, and tier 2 of the power state machine - while the wheel stands
# still the LIS2DH12 alone drops to 1 Hz with a movement interrupt armed, the
# BLE link stays up, and the CPU idles between connection events. That is where
# most of the saving is anyway.
#
# What cannot work: tier 3, System OFF. Waking from System OFF on nRF54L15 is
# GPIO DETECT on P0/P1, or RESET - there is no timer wake to fall back on. The
# module wires INT1 to P2.00, and port 2 has neither GPIOTE nor SENSE, so a
# board that has not been modified has no way to wake the SoC. Arming a wake pin
# that is not connected would power the device down for good, so this variant
# does not arm one - and Kconfig refuses the option without
# CSC_POWER_WAKE_LINE_WIRED.
#
# The cost is battery life, not function: the SoC never powers down, so a
# connected client keeps it awake around the clock. For a year on a CR2032 you
# need the wire, and then you want power.conf instead.
#
# Usage:
#   west build --sysbuild -b holyiot_25008/nrf54l15/cpuapp . -- \
#       -DEXTRA_CONF_FILE="debug.conf;diag.conf;stock.conf;dfu.conf"

# --- Wheel source: accelerometer, not the simulator ---------------------------
CONFIG_CSC_SIMULATE=n
CONFIG_CSC_WHEEL_SENSOR_ACCEL=y

# --- Sleep on standstill, but never power the SoC down ------------------------
# Tier 2 only. CSC_POWER_SYSTEM_OFF is deliberately absent and
# CSC_POWER_WAKE_LINE_WIRED is deliberately not set - see the header.
CONFIG_CSC_POWER_SAVE=y
