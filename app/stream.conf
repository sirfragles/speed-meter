# Bench-only: LIS2DH hardware-FIFO stream stack + the driver's own diagnostic shell.
#
# Enables the upstream lis2dh driver commands used for bring-up and hardware
# validation (register dump, FIFO counters, FIFO start/stop):
#
#   lis2dh status [device]     FIFO state, ODR and counters
#   lis2dh regs   [device]     dump control / FIFO / interrupt registers
#   lis2dh counters [device]   FIFO diagnostic counters
#   lis2dh start  [device]     start the hardware FIFO
#   lis2dh stop [cancel]       stop the FIFO (cancel also drops the stream)
#
# These replace the old hand-rolled `wheel reg` / `wheel raw` commands, which
# were removed in the driver-first refactor.
#
# Keep this OUT of the DFU/production build: the trigger mode below registers an
# IRQ handler on the INT1 line, and `wheel_power` (power.conf) uses that same pin
# for System OFF wake arming.

CONFIG_SENSOR_ASYNC_API=y

# LIS2DH_TRIGGER is a hidden symbol: it is selected by the trigger-mode choice.
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y

# Hardware FIFO -> RTIO stream + sensor_async API decoder.
CONFIG_LIS2DH_STREAM=y

# Driver shell: `lis2dh status|regs|counters|start|stop`.
CONFIG_LIS2DH_SHELL=y
