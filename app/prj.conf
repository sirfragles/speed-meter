# Speed Meter - Bluetooth cycling speed sensor (CSCS).

# --- Bluetooth: peripheral with the Cycling Speed and Cadence service --------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Speed Meter"
# "Cycling: General" style appearance used by cycling sensors.
CONFIG_BT_DEVICE_APPEARANCE=1157

# Two simultaneous centrals: the Apple Watch plus a bike computer / phone
# display, both subscribed to CSC Measurement at the same time. The service
# is only advertised while fewer than BT_MAX_CONN links are up (see bt.c).
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
# Both Apple clients keep their own bond, and reconnecting relies on them.
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y

# --- Persistent configuration ------------------------------------------------
# Settings + NVS on the RRAM "storage" partition (0x174000, 36 kB):
#   - Bluetooth bonds (BT_SETTINGS) so paired watch/display reconnect after a
#     reboot or a battery change without re-pairing,
#   - wheel configuration (circumference, ODR, range, detector thresholds),
#     see src/wheel_config.c.
#
# FLASH is off by default unless MCUboot is part of the build, so ask for the
# Nordic RRAM driver explicitly; SETTINGS_NVS additionally needs FLASH_MAP.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# The CSCS service UUID (0x1816) is put in the advertising data by
# src/main.c - that is what Apple Watch scans for.

# Battery Service and Device Information Service (nice for Apple clients).
# The level comes from the SAADC; see the battery section below.
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n

# --- CR2032 measurement (SAADC internal VDD input) ---------------------------
# The CR2032 feeds VDD, so the SAADC can measure it internally: no divider, no
# extra pin, nothing to solder. The channel is configured in the board overlay
# as the first io-channel of the zephyr,user node - check it before changing
# anything here. CONFIG_CSC_BATTERY (Kconfig) controls the module itself.
CONFIG_ADC=y

# --- Logging -----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- LED (Zephyr LED driver over the board's gpio-leds node) -----------------
CONFIG_LED=y

# --- Console over J-Link RTT -------------------------------------------------
# UART (P1.04 TX / P1.05 RX) is repurposed: P1.05 carries the LIS2DH12 INT1
# wake line. Keep the UART console off and log over RTT instead.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
